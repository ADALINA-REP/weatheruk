name: Deploy iOS to App Store Connect

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_deploy_ios:
    name: Build & Deploy iOS to TestFlight / App Store
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager for iOS
        run: flutter config --no-enable-swift-package-manager

      - name: Install Dependencies
        run: flutter pub get

      - name: Set up App Store Connect API Key
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          CLEAN_KEY_ID=$(echo "${APP_STORE_CONNECT_KEY_ID}" | grep -oE '[A-Z0-9]{10}' | head -n 1)
          if [ -z "$CLEAN_KEY_ID" ]; then
            CLEAN_KEY_ID="9HC3ZFHYQ7"
          fi
          TARGET_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8"
          if [[ "$APP_STORE_CONNECT_API_KEY" == *"BEGIN PRIVATE KEY"* ]]; then
            printf "%s\n" "$APP_STORE_CONNECT_API_KEY" > "$TARGET_FILE"
          else
            echo -n "$APP_STORE_CONNECT_API_KEY" | base64 --decode > "$TARGET_FILE"
          fi

      - name: Build iOS Frameworks & Assets
        run: flutter build ios --release --no-codesign

      - name: Create ExportOptions.plist
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>JTVCP8PGV8</string>
              <key>uploadSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Archive and Export Signed IPA
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          CLEAN_KEY_ID=$(echo "${APP_STORE_CONNECT_KEY_ID}" | grep -oE '[A-Z0-9]{10}' | head -n 1)
          if [ -z "$CLEAN_KEY_ID" ]; then
            CLEAN_KEY_ID="9HC3ZFHYQ7"
          fi
          CLEAN_ISSUER_ID=$(echo "${APP_STORE_CONNECT_ISSUER_ID}" | grep -oE '[a-fA-F0-9-]{36}' | head -n 1)
          if [ -z "$CLEAN_ISSUER_ID" ]; then
            CLEAN_ISSUER_ID="b4575c22-8a31-4f97-bed4-889e3c21a7b5"
          fi
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8"
          
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$CLEAN_KEY_ID" \
            -authenticationKeyIssuerID "$CLEAN_ISSUER_ID" \
            archive DEVELOPMENT_TEAM="JTVCP8PGV8" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

          find build/Runner.xcarchive/Products/Applications/Runner.app/Frameworks -mindepth 1 -maxdepth 1 2>/dev/null | while read -r fw; do
            echo "Pre-signing framework: $fw"
            codesign --force --verbose --sign "-" "$fw" || true
          done

          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$CLEAN_KEY_ID" \
            -authenticationKeyIssuerID "$CLEAN_ISSUER_ID" \
            OTHER_CODE_SIGN_FLAGS="--deep"

      - name: Upload IPA to App Store Connect
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          CLEAN_KEY_ID=$(echo "${APP_STORE_CONNECT_KEY_ID}" | grep -oE '[A-Z0-9]{10}' | head -n 1)
          if [ -z "$CLEAN_KEY_ID" ]; then
            CLEAN_KEY_ID="9HC3ZFHYQ7"
          fi
          CLEAN_ISSUER_ID=$(echo "${APP_STORE_CONNECT_ISSUER_ID}" | grep -oE '[a-fA-F0-9-]{36}' | head -n 1)
          if [ -z "$CLEAN_ISSUER_ID" ]; then
            CLEAN_ISSUER_ID="b4575c22-8a31-4f97-bed4-889e3c21a7b5"
          fi
          IPA_FILE=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          echo "Uploading $IPA_FILE to App Store Connect..."
          xcrun altool --upload-app -f "$IPA_FILE" -t ios --apiKey "$CLEAN_KEY_ID" --apiIssuer "$CLEAN_ISSUER_ID"
